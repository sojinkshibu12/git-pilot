# ───────────────────────────────────────────────────────────────────────────────
# GitPilot — production-grade multi-service stack.
#
#   Profiles:
#     default   : postgres + redis only (for local backend dev)
#     full      : + backend, frontend, nginx (full stack)
# ───────────────────────────────────────────────────────────────────────────────
name: gitpilot

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: ./infra/docker/backend.Dockerfile
  restart: unless-stopped
  environment: &backend-env
    APP_ENV: ${APP_ENV:-local}
    SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
    TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env}
    GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID in .env}
    GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET in .env}
    GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI}
    GITHUB_SCOPE: ${GITHUB_SCOPE:-read:user user:email}
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    CORS_ORIGINS: '["http://localhost:3000"]'
    DB_POOL_SIZE: "20"
    DB_MAX_OVERFLOW: "40"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import httpx;r=httpx.get('http://localhost:8000/api/v1/health');r.raise_for_status()"]
    interval: 30s
    timeout: 5s
    retries: 5
    start_period: 20s
  networks:
    - gitpilot-net

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gitpilot-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - gitpilot-net

  migrate:
    <<: *backend-common
    profiles: ["full", "migrate"]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-common
    profiles: ["full"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4", "--proxy-headers"]
    expose:
      - "8000"
    # Uncomment to expose the API directly (dev):
    # ports:
    #   - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: .
      dockerfile: ./infra/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    profiles: ["full"]
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    expose:
      - "3000"
    depends_on:
      - backend
    networks:
      - gitpilot-net

  nginx:
    image: nginx:1.27-alpine
    profiles: ["full"]
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"   # API gateway
      - "${FRONTEND_PORT:-3000}:3000"  # Next.js
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certbot:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    networks:
      - gitpilot-net

volumes:
  postgres_data:
  redis_data:

networks:
  gitpilot-net:
    driver: bridge
