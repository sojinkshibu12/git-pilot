name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + type + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gitpilot
          POSTGRES_PASSWORD: gitpilot
          POSTGRES_DB: gitpilot
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gitpilot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -e ".[dev]"
          pip install argon2-cffi
      - name: Lint
        working-directory: backend
        run: ruff check app tests
      - name: Format check
        working-directory: backend
        run: ruff format --check app tests
      - name: Type check
        working-directory: backend
        run: mypy app
      - name: Test (with coverage ≥ 90%)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://gitpilot:gitpilot@localhost:5432/gitpilot
          REDIS_URL: redis://localhost:6379/0
        run: pytest

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build (backend + frontend)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile -t gitpilot-backend:ci .
      - name: Build frontend image
        run: |
          docker build -f infra/docker/frontend.Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1 \
            -t gitpilot-frontend:ci .

  security-scan:
    name: Security scanning (Trivy + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: pip-audit (Python deps)
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit
      - name: npm audit (JS deps)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Trivy repo scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
