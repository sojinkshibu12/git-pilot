# GitPilot Nginx gateway
#
#   :8000 → FastAPI (replaces uvicorn-only TLS termination)
#   :3000 → Next.js
#
# Production: uncomment the TLS server block and provision certs via
# `certbot --nginx` (see infra/nginx/README.md).

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rid="$http_x_request_id"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 20m;

    # Compressed responses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    upstream gitpilot_api {
        server backend:8000;
        keepalive 32;
    }
    upstream gitpilot_web {
        server frontend:3000;
        keepalive 32;
    }

    # ───────────────────────────────────────────────────────────────────────
    # HTTP (redirect → HTTPS in production; plain for local dev)
    # ───────────────────────────────────────────────────────────────────────
    server {
        listen 8000;
        listen 3000;
        server_name _;

        # Security headers at the edge.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Permitted-Cross-Domain-Policies none always;

        # API
        location /api/ {
            proxy_pass http://gitpilot_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
        }

        location = /health {
            proxy_pass http://gitpilot_api/health;
        }

        # Next.js
        location / {
            proxy_pass http://gitpilot_web;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ───────────────────────────────────────────────────────────────────────
    # TLS (production) — enable by uncommenting and setting DOMAIN.
    # ───────────────────────────────────────────────────────────────────────
    # server {
    #     listen 443 ssl http2;
    #     server_name ${DOMAIN};
    #     ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5:!3DES;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     ... same locations as above ...
    # }
}
